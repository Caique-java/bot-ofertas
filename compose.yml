services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-bot_ofertas}
      POSTGRES_USER: ${DB_USER:-bot}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no arquivo .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 512m
  bot:
    build: .
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-bot_ofertas}
      SERVER_ADDRESS: 0.0.0.0
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./config:/app/config:ro
      - botlogs:/app/logs
    ports:
      - '127.0.0.1:8080:8080'
    mem_limit: 768m
    stop_grace_period: 40s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
volumes:
  pgdata:
  botlogs:
